name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A dependency can become vulnerable without any change to this repo, so the
    # supply-chain job also runs on a schedule rather than only on pushes.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo test --workspace --all-features
          --exclude rdocx-py --exclude rpptx-py

  python-bindings:
    name: Python bindings (${{ matrix.package.distribution }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package:
          - { distribution: rdocx, crate: rdocx-py, oracle: "python-docx==1.2.0" }
          - { distribution: rpptx, crate: rpptx-py, oracle: "python-pptx==1.0.2" }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.9"
      - name: Install pinned Poppler
        shell: bash
        run: |
          brew install poppler
      - name: Create isolated binding environment
        shell: bash
        run: |
          binding_venv="${RUNNER_TEMP}/${{ matrix.package.distribution }}-venv"
          python -m venv "$binding_venv"
          binding_python="$binding_venv/bin/python"
          "$binding_python" -m pip install \
            maturin==1.13.3 \
            pytest==9.1.1 \
            "${{ matrix.package.oracle }}"
      - name: Build Python extension
        shell: bash
        run: |
          binding_venv="${RUNNER_TEMP}/${{ matrix.package.distribution }}-venv"
          binding_python="$binding_venv/bin/python"
          VIRTUAL_ENV="$binding_venv" \
            "$binding_python" -m maturin develop --locked \
              --manifest-path "crates/${{ matrix.package.crate }}/Cargo.toml"
      - name: Run full Python binding suite
        shell: bash
        run: |
          binding_venv="${RUNNER_TEMP}/${{ matrix.package.distribution }}-venv"
          binding_python="$binding_venv/bin/python"
          "$binding_python" -m pytest "crates/${{ matrix.package.crate }}/tests"

  no-default-features:
    name: No default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p oxml-layout --no-default-features

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-unknown-unknown -p rdocx-wasm

  prose:
    name: Prose and generated skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/prose_check.py
      - run: python3 scripts/sync_agent_skills.py --check

  hash-harness:
    name: Output stability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/hash_harness.py --check

  presentation-fidelity:
    name: Presentation fidelity
    runs-on: macos-26
    env:
      RDOCX_PPTX_CORPUS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned render oracle
        run: |
          brew install --cask libreoffice
          brew install poppler
      - name: Fetch pinned presentation corpus
        run: python3 scripts/fetch_pptx_corpus.py
      - name: Run all-slide SSIM trend and completeness gate
        run: >-
          python3 scripts/pptx_ssim_harness.py --check
          --output-dir "${RUNNER_TEMP}/presentation-fidelity"
      - name: Retain presentation fidelity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-fidelity-evidence
          path: |
            ${{ runner.temp }}/presentation-fidelity/gate-evidence.json
            ${{ runner.temp }}/presentation-fidelity/render-manifest.tsv
            ${{ runner.temp }}/presentation-fidelity/ssim-results.tsv
          if-no-files-found: warn

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo clippy --workspace --all-targets --all-features
          --exclude rdocx-py --exclude rpptx-py -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  doc:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo doc --workspace --no-deps --all-features
          --exclude rdocx-py --exclude rpptx-py

  package-oxml-layout:
    name: Package oxml-layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check package inventory
        shell: bash
        run: |
          if grep -Eq '^publish[[:space:]]*=[[:space:]]*false' crates/oxml-layout/Cargo.toml; then
            echo "oxml-layout is still excluded from publication" >&2
            exit 1
          fi

          packaged_fonts=$(
            cargo package -p oxml-layout --list |
              grep -E '^fonts/.*\.ttf$' |
              sort
          )
          expected_fonts="$(printf '%s\n' \
            fonts/Caladea-Bold.ttf \
            fonts/Caladea-BoldItalic.ttf \
            fonts/Caladea-Italic.ttf \
            fonts/Caladea-Regular.ttf \
            fonts/Carlito-Bold.ttf \
            fonts/Carlito-BoldItalic.ttf \
            fonts/Carlito-Italic.ttf \
            fonts/Carlito-Regular.ttf \
            fonts/LiberationMono-Bold.ttf \
            fonts/LiberationMono-BoldItalic.ttf \
            fonts/LiberationMono-Italic.ttf \
            fonts/LiberationMono-Regular.ttf \
            fonts/LiberationSans-Bold.ttf \
            fonts/LiberationSans-BoldItalic.ttf \
            fonts/LiberationSans-Italic.ttf \
            fonts/LiberationSans-Regular.ttf \
            fonts/LiberationSerif-Bold.ttf \
            fonts/LiberationSerif-BoldItalic.ttf \
            fonts/LiberationSerif-Italic.ttf \
            fonts/LiberationSerif-Regular.ttf)"
          diff -u \
            <(printf '%s\n' "$expected_fonts") \
            <(printf '%s\n' "$packaged_fonts")

          packaged_legal=$(
            cargo package -p oxml-layout --list |
              grep -E '^fonts/(LICENSE|NOTICE)-' |
              sort
          )
          expected_legal="$(printf '%s\n' \
            fonts/LICENSE-Caladea \
            fonts/LICENSE-Carlito \
            fonts/LICENSE-Liberation \
            fonts/NOTICE-Caladea)"
          diff -u \
            <(printf '%s\n' "$expected_legal") \
            <(printf '%s\n' "$packaged_legal")
      - name: Verify package and archive size
        shell: bash
        run: |
          cargo package -p oxml-layout
          archive=$(find target/package -maxdepth 1 -name 'oxml-layout-*.crate' -print -quit)
          if [ -z "$archive" ]; then
            echo "oxml-layout archive was not generated" >&2
            exit 1
          fi
          archive_size=$(stat -c %s "$archive")
          if [ "$archive_size" -gt 10485760 ]; then
            echo "package exceeds 10 MiB: $archive ($archive_size bytes)" >&2
            exit 1
          fi

  msrv:
    name: MSRV (1.93)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo test --workspace --all-features
          --exclude rdocx-py --exclude rpptx-py

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # cargo-deny reads the same RustSec advisory database as cargo-audit, and
      # additionally honours the documented exceptions in deny.toml and checks
      # licences, banned crates and source registries. Running audit-check as
      # well would duplicate the advisory scan, re-report the exceptions
      # deny.toml already accounts for, and need `checks: write` on the token
      # just to publish its check run.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
