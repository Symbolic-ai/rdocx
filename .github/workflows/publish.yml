name: Publish

on:
  push:
    tags: ["v*", "rpptx-v*"]

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2

      - name: Verify output stability
        run: python3 scripts/hash_harness.py --check

      - name: Verify publication archives
        run: cargo publish --workspace --dry-run

      - name: Publish stable allowlist
        if: startsWith(github.ref_name, 'v')
        run: |
          cargo publish -p rdocx-opc
          sleep 60
          cargo publish -p rdocx-oxml
          sleep 60
          cargo publish -p rdocx-layout
          sleep 60
          cargo publish -p rdocx-html
          sleep 60
          cargo publish -p rdocx-pdf
          sleep 60
          cargo publish -p rdocx
          sleep 60
          cargo publish -p rdocx-cli

      - name: Publish incubating allowlist
        if: startsWith(github.ref_name, 'rpptx-v')
        run: |
          cargo publish -p oxml-core
          sleep 60
          cargo publish -p oxml-opc
          sleep 60
          cargo publish -p oxml-media
          sleep 60
          cargo publish -p oxml-layout
          sleep 60
          cargo publish -p oxml-drawing
          sleep 60
          cargo publish -p oxml-pdf
          sleep 60
          cargo publish -p oxml-sml
          sleep 60
          cargo publish -p rpptx-oxml
          sleep 60
          cargo publish -p rpptx-chart
          sleep 60
          cargo publish -p rpptx-layout
          sleep 60
          cargo publish -p rpptx-render
          sleep 60
          cargo publish -p rpptx

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
