[workspace]
resolver = "3"
members = [
    "crates/oxml-core",
    "crates/oxml-drawing",
    "crates/oxml-layout",
    "crates/oxml-media",
    "crates/oxml-opc",
    "crates/oxml-pdf",
    "crates/oxml-sml",
    "crates/rpptx",
    "crates/rpptx-chart",
    "crates/rpptx-layout",
    "crates/rpptx-oxml",
    "crates/rpptx-render",
    "crates/rdocx-opc",
    "crates/rdocx-oxml",
    "crates/rdocx",
    "crates/rdocx-layout",
    "crates/rdocx-pdf",
    "crates/rdocx-html",
    "crates/rdocx-cli",
    "crates/rdocx-wasm",
]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.93"
authors = ["Atul Sharma"]
repository = "https://github.com/tensorbee/rdocx"
homepage = "https://github.com/tensorbee/rdocx"
keywords = ["docx", "word", "pdf", "ooxml", "document"]
categories = ["parser-implementations", "text-processing"]

[workspace.metadata.release]
consolidate-commits = true
dependent-version = "upgrade"
pre-release-commit-message = "Prepare release {{version}}"
verify = true
publish = false
tag = false
push = false

[workspace.dependencies]
# Internal crates
oxml-core = { path = "crates/oxml-core", version = "0.1.0" }
oxml-drawing = { path = "crates/oxml-drawing", version = "0.1.0" }
oxml-layout = { path = "crates/oxml-layout", version = "0.1.0" }
oxml-media = { path = "crates/oxml-media", version = "0.1.0" }
oxml-opc = { path = "crates/oxml-opc", version = "0.1.0" }
oxml-pdf = { path = "crates/oxml-pdf", version = "0.1.0" }
oxml-sml = { path = "crates/oxml-sml", version = "0.1.0" }
rpptx = { path = "crates/rpptx", version = "0.1.0" }
rpptx-chart = { path = "crates/rpptx-chart", version = "0.1.0" }
rpptx-layout = { path = "crates/rpptx-layout", version = "0.1.0" }
rpptx-oxml = { path = "crates/rpptx-oxml", version = "0.1.0" }
rpptx-render = { path = "crates/rpptx-render", version = "0.1.0" }
rdocx-opc = { path = "crates/rdocx-opc", version = "0.4.1" }
rdocx-oxml = { path = "crates/rdocx-oxml", version = "0.4.1" }
rdocx = { path = "crates/rdocx", version = "0.4.1" }
rdocx-layout = { path = "crates/rdocx-layout", version = "0.4.1" }
rdocx-pdf = { path = "crates/rdocx-pdf", version = "0.4.1" }
rdocx-html = { path = "crates/rdocx-html", version = "0.4.1" }

# External dependencies
#
# Feature sets are deliberately minimal: a DOCX is a ZIP that only ever uses
# the Stored and Deflate methods, so the aes-crypto/bzip2/lzma/ppmd/zstd/xz
# codecs and the `time` timestamp support are all dead weight — and they drag
# in getrandom -> wasm-bindgen/js-sys. Likewise fontdb's `memmap` feature is
# off: fonts are read into memory anyway, and it avoids memmap2 entirely.
zip = { version = "8.1", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }
quick-xml = "0.41"
thiserror = "2"
fontdb = { version = "0.23", default-features = false, features = [
    "std",
    "fs",
    "fontconfig",
] }
harfrust = "0.12"
ttf-parser = "0.25"
unicode-linebreak = "0.1"
itoa = "1"
regex = "1.13"
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
pdf-writer = "0.15"
subsetter = "0.2"
miniz_oxide = "0.9"
tiny-skia = "0.12"
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
wasm-bindgen = "0.2.126"
js-sys = "0.3.103"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
