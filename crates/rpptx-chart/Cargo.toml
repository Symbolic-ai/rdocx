[package]
name = "rpptx-chart"
description = "ChartML modeling, editing, and rendering geometry for presentations"
readme = "README.md"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["pptx", "powerpoint", "ooxml", "chart"]
