[package]
name = "rpptx"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["pptx", "powerpoint", "ooxml", "presentation"]
categories = ["parser-implementations", "text-processing"]
publish = true

[package.metadata.release]
shared-version = "incubating"
tag-name = "rpptx-v{{version}}"

[features]
default = ["default-template"]
default-template = []

[dependencies]
oxml-core.workspace = true
oxml-drawing.workspace = true
oxml-layout.workspace = true
oxml-media.workspace = true
oxml-opc.workspace = true
oxml-sml.workspace = true
rpptx-chart.workspace = true
rpptx-oxml.workspace = true
thiserror.workspace = true

[dev-dependencies]
miniz_oxide.workspace = true
oxml-drawing.workspace = true
oxml-layout.workspace = true
oxml-pdf.workspace = true
rpptx-layout.workspace = true
rpptx-render.workspace = true
